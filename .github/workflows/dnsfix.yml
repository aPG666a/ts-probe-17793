# 17860 dns fix + turnstile render
name: dnsfix
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "ip=$(curl -s -m 15 https://api.ipify.org)"
          sudo apt-get -qq update >/dev/null 2>&1; sudo apt-get -qq install -y xvfb dnsutils >/dev/null 2>&1
          echo "--- before"
          getent ahostsv4 challenges.cloudflare.com brunhild.challenges.cloudflare.com hagen.challenges.cloudflare.com foxrouter.org || true
          python3 resolve.py > doh.out 2> doh.err; cat doh.err
          HOSTS=$(grep -E '^[0-9]' doh.out)
          echo "$HOSTS" | sudo tee -a /etc/hosts
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf
          grep -E '^(CH|BR|HG|FR)=' doh.out >> "$GITHUB_ENV"
          echo "--- after: getent hosts each"
          for h in challenges.cloudflare.com brunhild.challenges.cloudflare.com hagen.challenges.cloudflare.com foxrouter.org api.foxrouter.org; do echo -n "$h => "; getent hosts "$h" | head -2 | tr '\n' ' '; echo; done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          RUNNER_TEMP: ${{ runner.temp }}
          ROUNDS: '6'
          SECS: '150'
        run: |
          cd "$RUNNER_TEMP"; mkdir -p w; cd w
          npm init -y >/dev/null 2>&1; npm i playwright-core@1.47.2 --silent >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/solve.js" "$GITHUB_WORKSPACE/page_local.html" .
          echo "127.0.0.1 api.foxrouter.org" | sudo tee -a /etc/hosts
          getent hosts api.foxrouter.org
          sudo -E xvfb-run -a node solve.js 2>&1 | tail -400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dnsfix
          path: |
            ${{ runner.temp }}/r.log
            ${{ runner.temp }}/token.txt
            ${{ runner.temp }}/shot_*.png
